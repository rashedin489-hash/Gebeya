<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6e4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>RASHEDIN gebeya</title>
<style>
:root{
  --pri:#0b6e4f; --pri2:#0f8a63; --acc:#f4a300; --red:#d64545;
  --bg:#f5f7f4; --card:#ffffff; --txt:#15201b; --mut:#66756d; --line:#e2e8e3; --chip:#e8efe9;
  --shadow:0 2px 10px rgba(10,40,25,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1512;--card:#16211c;--txt:#e9f1ec;--mut:#8fa197;--line:#243029;--chip:#1e2b25;--shadow:0 2px 10px rgba(0,0,0,.4);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Ethiopic","Abyssinica SIL",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.4;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;position:relative;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--txt);width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri2)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 6px}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:var(--pri);color:#fff}
header .logo{font-weight:800;font-size:20px;letter-spacing:.2px}
header .logo small{font-weight:500;opacity:.85;font-size:13px;margin-left:6px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.2)}
.pill.off{background:var(--acc);color:#3a2600}
main{flex:1;overflow-y:auto;padding:12px 14px 90px;-webkit-overflow-scrolling:touch}
nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);padding:4px 0}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--pri2)}
nav button.post .plus{width:46px;height:46px;border-radius:50%;background:var(--acc);color:#3a2600;display:grid;place-items:center;margin-top:-20px;box-shadow:var(--shadow)}
nav button.post .plus svg{width:26px;height:26px}
.banner{background:#fff3d6;color:#5b3e00;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mut)}
.search input{padding-left:40px;border-radius:99px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:var(--chip);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);position:relative;cursor:pointer}
.thumb{aspect-ratio:1/1;background:var(--chip);display:grid;place-items:center;font-size:54px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.cb{padding:9px 10px 11px}
.price{font-weight:800;color:var(--pri2);font-size:15px}
.title{font-size:14px;font-weight:600;margin:2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--mut)}
.tag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff}
.tag.sold{background:var(--red)}
.empty{text-align:center;color:var(--mut);padding:50px 20px}
.empty .big{font-size:46px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-weight:700;background:var(--pri);color:#fff;width:100%}
.btn.sec{background:var(--chip);color:var(--txt)}
.btn.acc{background:var(--acc);color:#3a2600}
.btn.red{background:#fde8e8;color:var(--red)}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:10px}
.row>*{flex:1}
h2{margin:6px 0 4px;font-size:20px}
.sub{color:var(--mut);font-size:14px;margin:0 0 6px}
.box{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.box h3{margin:0 0 6px;font-size:16px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ph{width:78px;height:78px;border-radius:12px;background:var(--chip);position:relative;overflow:hidden;display:grid;place-items:center;font-size:26px;color:var(--mut)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:22px;text-align:center}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:600;font-size:14px}
.seg button.on{background:var(--pri);color:#fff}
/* detail sheet */
.sheet{position:absolute;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-bottom:30px}
.sheet .top{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:linear-gradient(var(--bg),transparent)}
.round{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.round svg{width:20px;height:20px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:-60px}
.gal>div{flex:none;width:100%;aspect-ratio:1/1;scroll-snap-align:start;background:var(--chip);display:grid;place-items:center;font-size:110px}
.gal img{width:100%;height:100%;object-fit:cover}
.dbody{padding:14px 16px}
.dbody .price{font-size:24px}
.dbody h1{font-size:20px;margin:4px 0 8px}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.kv span{background:var(--chip);padding:5px 11px;border-radius:99px;font-size:13px;font-weight:600}
.desc{white-space:pre-wrap;color:var(--txt);margin:10px 0 16px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
/* toast */
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
/* lock */
.lock{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:linear-gradient(160deg,var(--pri),#06402d);color:#fff;padding-top:calc(env(safe-area-inset-top,0px) + 20px)}
.lock .emb{width:84px;height:84px;border-radius:24px;background:var(--acc);color:#3a2600;display:grid;place-items:center;font-size:44px;font-weight:800;margin-bottom:10px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.lock h1{margin:4px 0;font-size:26px}
.lock p{margin:2px 0 18px;opacity:.85}
.dots{display:flex;gap:14px;margin:4px 0 8px;height:18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;opacity:.9}
.dots i.f{background:#fff}
.dots.bad{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.err{min-height:22px;color:#ffd0d0;font-weight:600;font-size:14px}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin:8px 0 16px}
.pad button{height:72px;border-radius:50%;background:rgba(255,255,255,.14);font-size:26px;font-weight:600;color:#fff}
.pad button:active{background:rgba(255,255,255,.32)}
.lock .lg{display:flex;gap:8px;margin-bottom:12px}
.lock .lg button{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:600}
.lock .lg button.on{background:#fff;color:var(--pri)}
.lock a{color:#fff;font-weight:700}
/* assistant */
.orbwrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px}
.orb{--lvl:0;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6ee7b7,var(--pri2) 55%,#06402d);box-shadow:0 0 0 calc(8px + var(--lvl)*26px) rgba(15,138,99,.22);transition:box-shadow .12s;opacity:.55}
.orb.connecting{opacity:.9;animation:pulse 1.2s infinite}
.orb.live{opacity:1}
.orb.speaking{opacity:1;animation:speak .9s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes speak{0%,100%{transform:scale(1);box-shadow:0 0 0 10px rgba(244,163,0,.25)}50%{transform:scale(1.06);box-shadow:0 0 0 24px rgba(244,163,0,.12)}}
.status{margin-top:12px;font-weight:700}
.time{color:var(--mut);font-variant-numeric:tabular-nums;font-size:14px;min-height:20px}
.ctrl{display:flex;gap:16px;justify-content:center;margin:12px 0}
.cbtn{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--chip)}
.cbtn.call{background:#1a9d5c;color:#fff;width:76px;height:76px}
.cbtn.end{background:var(--red);color:#fff;width:76px;height:76px}
.cbtn.on{background:var(--acc);color:#3a2600}
.cbtn svg{width:30px;height:30px}
.log{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.b{max-width:86%;padding:9px 13px;border-radius:16px;font-size:15px;white-space:pre-wrap}
.b.u{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}
.b.a{align-self:flex-start;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:4px}
.b small{display:block;opacity:.6;font-size:11px;margin-top:3px}
.ask{display:flex;gap:8px;margin-top:6px}
.ask button{width:48px;flex:none;border-radius:12px;background:var(--pri);color:#fff;display:grid;place-items:center}
.ask svg{width:22px;height:22px}
.qs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.qs .chip{font-size:13px}
a{color:var(--pri2)}
header .logo{display:flex;align-items:center;gap:8px}
header .logo img{width:34px;height:34px;border-radius:50%}
.lock .emb{width:124px;height:124px;border-radius:50%;object-fit:cover;background:none;display:block;font-size:0}
.regbox{background:var(--card);color:var(--txt);border-radius:18px;padding:6px 16px 16px;width:100%;max-width:400px;text-align:left}
.regbox .sub{opacity:1}
</style>
</head>

/* ============ STORAGE (IndexedDB with fallback) ============ */
let dbp = null, memList = [];
function db(){
  if(!dbp) dbp = new Promise((res,rej)=>{
    try{ const r = indexedDB.open("gebeya",1);
      r.onupgradeneeded = () => r.result.createObjectStore("listings",{keyPath:"id"});
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }catch(e){ rej(e); }
  });
  return dbp;
}
async function dbAll(){
  try{ const d = await db(); return await new Promise((res,rej)=>{ const q=d.transaction("listings").objectStore("listings").getAll(); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
  catch(e){ return memList.slice(); }
}
async function dbPut(item){
  try{ const d = await db(); await new Promise((res,rej)=>{ const tx=d.transaction("listings","readwrite"); tx.objectStore("listings").put(item); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
  catch(e){ memList = memList.filter(x=>x.id!==item.id).concat(item); }
}
async function dbDel(id){
  try{ const d = await db(); await new Promise((res,rej)=>{ const tx=d.transaction("listings","readwrite"); tx.objectStore("listings").delete(id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }
  catch(e){ memList = memList.filter(x=>x.id!==id); }
}

const fmtPrice = p => (p===""||p==null||isNaN(p)) ? t("ask_price") : Number(p).toLocaleString("en-US")+" "+t("birr");
function ago(ts){
  const m = Math.floor((Date.now()-ts)/60000);
  if(m<1) return t("ago_now"); if(m<60) return t("ago_m",{n:m});
  const h = Math.floor(m/60); if(h<24) return t("ago_h",{n:h});
  return t("ago_d",{n:Math.floor(h/24)});
}
function intlPhone(p){ let d=String(p).replace(/\D/g,""); if(d.startsWith("251")) return d; if(d.startsWith("0")) return "251"+d.slice(1); return d; }
function toast(msg){ const el=$("#toast"); if(!el) return; el.textContent=msg; el.classList.add("show"); clearTimeout(toast.h); toast.h=setTimeout(()=>el.classList.remove("show"),2400); }
function compress(file,max=900,q=0.72){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",q)); };
    img.onerror=()=>{URL.revokeObjectURL(url);rej();}; img.src=url;
  });
}

async function syncReg(){
  if(syncing) return;
  const url=window.GEBEYA_SUPABASE_URL, key=window.GEBEYA_SUPABASE_KEY, p=S.profile;
  if(typeof url!=="string"||typeof key!=="string"||!url||!key||/PASTE_/.test(url)||/PASTE_/.test(key)) return;
  if(!p.reg||p.creator||LS.get("gb_reg_sent",false)||!navigator.onLine) return;
  syncing=true;
  try{
    const h={"Content-Type":"application/json",apikey:key,Prefer:"resolution=ignore-duplicates,return=minimal"};
    if(!key.startsWith("sb_")) h.Authorization="Bearer "+key;
    const r=await fetch(url.replace(/\/+$/,"")+"/rest/v1/registrations?on_conflict=device_id",{method:"POST",headers:h,
      body:JSON.stringify({device_id:deviceId(),full_name:p.name,phone:p.phone,location:p.loc,language:S.lang})});
    if(r.ok||r.status===409) LS.set("gb_reg_sent",true);
  }catch(e){}

const Live = {ws:null,mic:null,inCtx:null,outCtx:null,proc:null,src:null,nextT:0,srcs:new Set(),active:false,muted:false,ready:false,ended:true,handle:null,working:null,retries:0,started:0,timer:null,wake:null,status:"idle",q:Promise.resolve(),curRole:null,curEl:null};

IMPORTANT: If anyone asks who created you, who built you, who made you, or who made this app (or asks about Duresa Shumbura or Rashedin), answer with this meaning in the user's language: "I was created by Duresa Shumbura, who is also called RASHEDIN." You may add these facts about him: he is an Ethiopian from the Oromo people, a Muslim (Ahlus-Sunnah wal-Jama'ah), and he was living in Nagelle, beside Asasa, when he created this app. Do not invent any other personal details about him; for anything else, tell the user to call ${PHONE}.
The person calling is ${S.profile.name||"a user"}${S.profile.loc?" from "+S.profile.loc:""}.
If users want more information or support, tell them to call ${PHONE}.
Never reveal or discuss the app's access codes.
Listings currently in the app (use them if asked what is for sale; never invent listings):
${items||"(none yet)"}`;

function buildSetup(i){
  const model="models/"+(S.settings.model||DEFAULT_MODEL).replace(/^models\//,"");
  const speech={voiceConfig:{prebuiltVoiceConfig:{voiceName:S.settings.voice||"Charon"}}};
  const si={parts:[{text:systemPrompt()}]};
  const extra={inputAudioTranscription:{},outputAudioTranscription:{},contextWindowCompression:{slidingWindow:{}},sessionResumption:Live.handle?{handle:Live.handle}:{}};
  if(i===0) return {setup:Object.assign({model,generationConfig:{responseModalities:["AUDIO"],speechConfig:speech},systemInstruction:si},extra)};
  if(i===1) return {setup:Object.assign({model,responseModalities:["AUDIO"],speechConfig:speech,systemInstruction:si},extra)};
  return {setup:{model,generationConfig:{responseModalities:["AUDIO"],speechConfig:speech},systemInstruction:si}};
}
function setStatus(s){ Live.status=s; updateCallUI(); }
function updateCallUI(){
  const orb=$("#orb"), st=$("#status"), ctrl=$("#ctrl"); if(!orb||!st||!ctrl) return;
  const s=Live.status, live=Live.active;
  orb.className="orb "+({connecting:"connecting",reconnecting:"connecting",live:"live",speaking:"speaking"}[s]||"");
  let txt = t("st_idle");
  if(live) txt = t({connecting:"st_connecting",reconnecting:"st_reconnecting",live:Live.muted?"unmute":"st_live",speaking:"st_speaking"}[s]||"st_connecting");
  else if(!getKey()) txt=t("st_nokey"); else if(!S.online) txt=t("st_offline");
  st.textContent=txt;
  const canCall = S.online && !!getKey();
  ctrl.innerHTML = live
    ? `<button class="cbtn ${Live.muted?"on":""}" data-act="mute" aria-label="${esc(t(Live.muted?"unmute":"mute"))}">${Live.muted?ICON.micoff:ICON.mic}</button><button class="cbtn end" data-act="callend" aria-label="${esc(t("end_call"))}">${ICON.phone}</button>`
    : `<button class="cbtn call" data-act="callstart" ${canCall?"":"disabled style=\"opacity:.4\""} aria-label="${esc(t("start_call"))}">${ICON.phone}</button>`;
  const ct=$("#ctime"); if(ct) ct.textContent = live && Live.started ? fmtTime(Date.now()-Live.started) : (live?"":"");
}
const fmtTime = ms => { const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };

async function startCall(){
  if(Live.active) return;
  if(!S.online || !getKey()){ updateCallUI(); return; }
  Live.ended=false; Live.active=true; Live.retries=0; Live.working=null; Live.handle=null; Live.muted=false; setStatus("connecting");
  try{
    Live.mic = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  }catch(err){ Live.active=false; Live.ended=true; setStatus("idle"); pushChat("ai",t("mic_err"),"⚠"); return; }
  try{
    const AC = window.AudioContext||window.webkitAudioContext;
    Live.outCtx = new AC({sampleRate:24000}); Live.inCtx = new AC();
    await Live.outCtx.resume(); await Live.inCtx.resume();
    Live.src = Live.inCtx.createMediaStreamSource(Live.mic);
    Live.proc = Live.inCtx.createScriptProcessor(4096,1,1);
    const mute = Live.inCtx.createGain(); mute.gain.value=0;
    Live.proc.onaudioprocess = onMicData;
    Live.src.connect(Live.proc); Live.proc.connect(mute); mute.connect(Live.inCtx.destination);
  }catch(err){ endCall(); pushChat("ai",t("mic_err"),"⚠"); return; }
  Live.started=Date.now();
  Live.timer=setInterval(()=>{ const ct=$("#ctime"); if(ct) ct.textContent=fmtTime(Date.now()-Live.started); },1000);
  try{ if(navigator.wakeLock) Live.wake = await navigator.wakeLock.request("screen"); }catch(e){}
  connect(0);
}
function connect(i){
  const url="wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key="+encodeURIComponent(getKey());
  let ws; try{ ws=new WebSocket(url); }catch(e){ fail(String(e)); return; }
  Live.ws=ws; Live.ready=false; let got=false;
  ws.onopen=()=>ws.send(JSON.stringify(buildSetup(i)));
  ws.onmessage=ev=>{ Live.q=Live.q.then(async()=>{
    let txt = typeof ev.data==="string" ? ev.data : await ev.data.text(); let m; try{ m=JSON.parse(txt); }catch(e){ return; }
    if(m.setupComplete){ got=true; Live.ready=true; Live.working=i; Live.retries=0; setStatus("live"); }
    handleMsg(m); }); };
  ws.onerror=()=>{};
  ws.onclose=ev=>{
    if(Live.ws!==ws || Live.ended) return; Live.ready=false;
    if(!got && Live.working==null){ if(i<2){ connect(i+1); return; } fail(ev.code+" "+(ev.reason||"")); return; }
    if(Live.retries<8 && S.online){ Live.retries++; setStatus("reconnecting"); setTimeout(()=>{ if(!Live.ended) connect(Live.working ?? 0); }, Math.min(1000*Live.retries,5000)); }
    else fail(ev.code+" "+(ev.reason||""));
  };
}
function fail(detail){ endCall(); pushChat("ai",t("conn_err")+(detail?" ("+detail.trim()+")":""),"⚠"); }
function handleMsg(m){
  const sc=m.serverContent;
  if(sc){
    if(sc.interrupted) stopPlayback();
    const parts = sc.modelTurn && sc.modelTurn.parts;
    if(parts) for(const p of parts) if(p.inlineData && p.inlineData.data) playPcm(p.inlineData.data);
    if(sc.inputTranscription && sc.inputTranscription.text) addTranscript("user",sc.inputTranscription.text);
    if(sc.outputTranscription && sc.outputTranscription.text) addTranscript("ai",sc.outputTranscription.text);
    if(sc.turnComplete){ Live.curRole=null; Live.curEl=null; }
  }
  if(m.sessionResumptionUpdate && m.sessionResumptionUpdate.newHandle && m.sessionResumptionUpdate.resumable!==false) Live.handle=m.sessionResumptionUpdate.newHandle;
  if(m.goAway){ setStatus("reconnecting"); try{ Live.ws.close(); }catch(e){} }
}
function addTranscript(role,text){
  if(Live.curRole!==role || !Live.curEl){ Live.curRole=role; Live.curEl={role,text:"",tag:""}; S.chat.push(Live.curEl); }
  Live.curEl.text += text; renderChat();
}
function playPcm(b64){
  if(!Live.outCtx) return;
  const bin=atob(b64), n=bin.length>>1, f=new Float32Array(n);
  for(let i=0;i<n;i++){ let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8); if(v&0x8000) v-=0x10000; f[i]=v/32768; }
  const buf=Live.outCtx.createBuffer(1,n,24000); buf.copyToChannel(f,0);
  const s=Live.outCtx.createBufferSource(); s.buffer=buf; s.connect(Live.outCtx.destination);
  const at=Math.max(Live.outCtx.currentTime+0.02,Live.nextT); s.start(at); Live.nextT=at+buf.duration;
  Live.srcs.add(s); if(Live.status==="live") setStatus("speaking");
  s.onended=()=>{ Live.srcs.delete(s); if(!Live.srcs.size && Live.status==="speaking") setStatus("live"); };
}
function stopPlayback(){ for(const s of Live.srcs){ try{ s.onended=null; s.stop(); }catch(e){} } Live.srcs.clear(); Live.nextT=0; if(Live.status==="speaking") setStatus("live"); }
function onMicData(e){
  const inp=e.inputBuffer.getChannelData(0);
  let sum=0; for(let i=0;i<inp.length;i+=8) sum+=inp[i]*inp[i]; const rms=Math.sqrt(sum/(inp.length/8));
  const orb=$("#orb"); if(orb) orb.style.setProperty("--lvl",Live.muted?0:Math.min(1,rms*9));
  if(!Live.ready||Live.muted||!Live.ws||Live.ws.readyState!==1) return;
  const ratio=Live.inCtx.sampleRate/16000, n=Math.floor(inp.length/ratio), out=new Int16Array(n);
  for(let i=0;i<n;i++){ const a=Math.floor(i*ratio), b=Math.min(inp.length,Math.floor((i+1)*ratio)); let s=0; for(let j=a;j<b;j++) s+=inp[j]; let v=s/Math.max(1,b-a); v=Math.max(-1,Math.min(1,v)); out[i]=v<0?v*32768:v*32767; }
  const bytes=new Uint8Array(out.buffer); let bin=""; for(let i=0;i<bytes.length;i+=8192) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+8192));
  Live.ws.send(JSON.stringify({realtimeInput:{audio:{data:btoa(bin),mimeType:"audio/pcm;rate=16000"}}}));
}
function endCall(){
  Live.ended=true; Live.active=false; Live.ready=false; Live.status="idle"; Live.started=0;
  clearInterval(Live.timer); try{ if(Live.ws){ Live.ws.onclose=null; Live.ws.close(); } }catch(e){} Live.ws=null;
  try{ if(Live.proc){ Live.proc.onaudioprocess=null; Live.proc.disconnect(); } if(Live.src) Live.src.disconnect(); }catch(e){}
  try{ if(Live.mic) Live.mic.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ stopPlayback(); if(Live.inCtx) Live.inCtx.close(); if(Live.outCtx) Live.outCtx.close(); }catch(e){}
  try{ if(Live.wake) Live.wake.release(); }catch(e){}
  Live.mic=Live.inCtx=Live.outCtx=Live.proc=Live.src=Live.wake=null; Live.curRole=null; Live.curEl=null; Live.handle=null;
  updateCallUI();
}
document.addEventListener("visibilitychange", async()=>{ if(!document.hidden && Live.active && navigator.wakeLock){ try{ Live.wake=await navigator.wakeLock.request("screen"); }catch(e){} } });

/* ============ START ============ */
(async function init(){
  await loadListings(); render(); syncReg();
  if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
})();
</script>
